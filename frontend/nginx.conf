# The SSE endpoint takes the bearer token as ?token= (EventSource cannot set headers): log the path without its query string.
log_format noargs '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log noargs;
    root /usr/share/nginx/html;
    index index.html;

    # Backend allows 20 MiB uploads (FORMUMIND_INGEST_MAX_UPLOAD_BYTES);
    # nginx default is 1m and would 413 before the request reaches the API.
    client_max_body_size 25m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE: task progress stream — disable buffering for long-lived connections
    location /api/tasks/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy API + health to the backend gateway
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }
    location /health {
        proxy_pass http://backend:8000;
    }
}
