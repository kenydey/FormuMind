# Alembic configuration for the FormuMind backend.
#
# Lives at the backend root (not inside app/db/) so the standard `alembic` CLI
# works from this directory without extra flags. The migration scripts live in
# app/db/alembic/; the database URL is resolved in env.py from the
# FORMUMIND_DB_URL environment variable, falling back to app settings.

[alembic]
# %(here)s interpolates to this ini's directory (the backend root), so the
# migration scripts are found no matter which cwd alembic is invoked from.
script_location = %(here)s/app/db/alembic
prepend_sys_path = %(here)s
path_separator = os
# Revision ids are zero-padded sequence numbers (0001, 0002, ...).
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Logging — kept terse; alembic itself logs at INFO.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
