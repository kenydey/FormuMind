[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formumind-backend"
version = "0.1.0"
description = "FormuMind — AI-assisted formulation R&D platform for metal surface treatment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.2.0",
    "loguru>=0.7",
    "rank-bm25>=0.2",
    "jieba>=0.42",
]

# Heavy / optional scientific engines. These are declared but NOT required to
# run the platform: every service has a deterministic offline fallback. Install
# with `pip install -e .[heavy]` on a machine that can support them, or run the
# corresponding Docker images (see docker-compose.yml).
[project.optional-dependencies]
llm = ["anthropic>=0.25", "openai>=1.30", "google-generativeai>=0.7"]
science = [
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "rdkit>=2023.9",
    "ChemFormula>=1.3",
    "thermo>=0.2",          # physical-property estimation (density → VOC g/L)
]
# CPU-only, pip-installable multi-objective / Bayesian optimizer. Sits between
# the built-in numpy UCB fallback and the heavy Summit engine.
optimize = ["optuna>=3.4"]
heavy = [
    "torch>=2.2",
    # summit>=0.8  pins torch<2.0 — conflicts; skipped
    "ase>=3.22",
]
intel = [
    "patent-client>=5.0",
    "paper-qa>=4.0",        # semantic RAG synthesis (auto-detected in chat)
    "chemcrow>=0.3.7",          # versions <0.3.7 pin openai==0.27.8, conflicts with openai>=1.30
    "molbloom>=2.0",        # standalone SureChEMBL patent pre-screen (no ChemCrow needed)
    "pubchempy>=1.0.4",     # enrich raw-material SMILES/molar-mass from PubChem
    "arxiv>=2.1",
    "ddgs>=6.0",            # renamed from duckduckgo-search
]
# MarkItDown keeps every format backend behind an extra — a bare install parses
# nothing but plain text, so .pptx/.xlsx silently yield an empty document and
# .docx falls back to python-docx, which drops tables. The extras are the whole
# point of depending on it.
file_ingest = [
    "markitdown[pdf,docx,pptx,xlsx]>=0.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "trafilatura>=1.8",
]
# Layout-aware PDF → Markdown parsers. FORMUMIND_PDF_PARSER picks the tier:
# hybrid → docling → marker → MinerU → MarkItDown → pypdf.
#
# ⚠️ LICENSING: pymupdf4llm and its PyMuPDF backend are AGPL-3.0, or a paid
# Artifex commercial licence. Every call to them is confined to
# app/services/pdf_local.py so this can be swapped without an audit.
#
# docling and marker-pdf pull torch and are impractical on a small CPU-only
# host (marker measures ~54 s/page without a GPU); they stay declared for
# machines that can afford them.
parse_pro = [
    # Local OCR for scanned pages. rapidocr>=3.9 ships the PP-OCRv6 small ONNX
    # weights inside the wheel, so no model download at deploy time.
    # opencv-python-headless is pinned explicitly: the default opencv-python drags
    # in GUI libraries that a headless VPS does not have.
    "rapidocr>=3.9.0",
    "opencv-python-headless>=4.9",
    "pymupdf4llm>=0.0.17",
    "mineru-open-sdk>=0.2.5",
    "docling>=2.0",
    "marker-pdf>=1.0",
]
export = ["openpyxl>=3.1"]
# Semantic-embedding RAG upgrade: sentence-transformers + optional chromadb.
# CPU-only; no GPU required. Activates EmbeddingStore in rag.py automatically.
embedding = ["sentence-transformers>=2.6"]
# True Gaussian-process optimizer (BoTorch + gpytorch + torch CPU).
# Activates BotorchOptimizer (GP + Log-EI acquisition) in optimizer.py.
bo = ["botorch>=0.10", "gpytorch>=1.11", "torch>=2.2"]
# Classic DOE designs (LHS, CCD, mixture simplex, Sobol, …).
pydoe = ["pydoe>=0.3"]
# Enterprise Bayesian back-end for constrained active learning.
baybe = ["baybe>=0.14", "pandas>=2.0"]
# CIELAB / CIEDE2000 colorimetry. Pure Python, no GPU.
# Activates delta_e + lab_L/a/b metrics in the predictor.
color = ["colour-science>=0.4"]
# NotebookLM as a retrieval source (unofficial SDK; browser-session auth).
# [browser] pulls Playwright + Chromium for the one-time `notebooklm login`.
notebooklm = ["notebooklm-py[browser]>=0.1"]
# ColBERT late-interaction retrieval (RAGatouille + torch CPU).
colbert = ["ragatouille>=0.0.8", "torch>=2.2"]
# LangGraph CRAG workflow + structured logging.
crag = ["langgraph>=0.2"]
intel-colbert = [
    "ragatouille>=0.0.8",
    "torch>=2.2",
    "langgraph>=0.2",
    "sentence-transformers>=2.6",
    "patent-client>=5.0",
    "arxiv>=2.1",
    "ddgs>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.0",
    "httpx>=0.27",
    "pypdf>=4.0",             # real PDF parsing in test_pdf_downloader real-path tests
]
postgres = ["psycopg2-binary>=2.9"]
# DECIMER 离线 OCSR：cpu 纯识别 / gpu 含结构切分（预留）。
# 均需独立 venv + 独立 Celery worker（tensorflow 与主 env 的 torch 冲突）。
# ⚠️ decimer 声明依赖 tensorflow（完整版），cpu 模式安装后须
#    `pip uninstall tensorflow && pip install tensorflow-cpu`（见 setup_decimer_worker.sh）。
decimer-cpu = ["decimer>=2.8.0", "tensorflow-cpu>=2.12,<2.21"]
decimer-gpu = ["decimer>=2.8.0", "tensorflow>=2.12,<2.21", "decimer-segmentation>=1.5.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "golden_eval: golden QA dataset evaluation — slower, use -m 'not golden_eval' to skip in fast local runs",
]
