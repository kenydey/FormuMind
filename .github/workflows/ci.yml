# This repository had no CI at all. That is how main came to sit at 11 failing
# tests — including a chat endpoint returning HTTP 500 and a 10x unit error in
# formulation levers — with 1300+ tests that only ever ran by hand.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # A newer push to the same ref makes the older run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile:1 — testing on a different minor than
          # the image ships would let a version-specific break through.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # requirements.txt is hand-maintained (it carries comments explaining
        # why individual pins exist) and is what the Dockerfile installs from,
        # so it is the source of truth here too. Never regenerate it with
        # `pip freeze`. The dev extra adds only the test tooling.
        # llm + science extras pull openai / rdkit so vision + chemistry suites
        # exercise real code paths instead of ModuleNotFoundError skips/fails.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev,llm,science]'

      - name: Run tests
        # golden_eval is the slow QA-dataset suite; everything else must pass.
        # FORMUMIND_CELERY_EAGER is set by tests/conftest.py so async endpoints
        # run in-process without a Redis service on the runner.
        run: pytest -m "not golden_eval" -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches frontend/Dockerfile:1.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Regenerated package-lock (2026-09-05) keeps platform optional deps
        # correctly marked. Fall back to npm install if npm ci hits an
        # optional-platform EBADPLATFORM quirk on the runner.
        run: npm ci || npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        # A project can typecheck and still fail to bundle, so the build is
        # its own gate rather than an assumed consequence of the two above.
        run: npm run build
