# Catches optional extras that silently downgrade a pinned base dependency.
#
# `pip install -e ".[intel]"` — recommended in the README and both user guides —
# used to resolve its conflict with requirements.txt by downgrading rather than
# by failing. Measured: httpx 0.28.1 -> 0.27.2, pypdf 6.14.2 -> 4.3.1,
# ddgs 9.14.4 -> 9.14.3. httpx is used across the whole codebase and pypdf sits
# in the parse cascade, so this is not cosmetic - and the Dockerfile installs
# `intel`, so the production image shipped pypdf 4.3.1 (49 published advisories,
# all crafted-PDF denial of service). The cause, patent-client, now lives in its
# own `patents` extra that nothing installs by default.
#
# `pip check` does NOT find it: after the downgrade the environment is
# internally consistent, just not the one requirements.txt describes.
#
# Deliberately resolution-only (`--dry-run --report`) — pip decides the
# downgrade while resolving, so nothing needs downloading or building and the
# job finishes in seconds. No torch: the `intel` extra resolves to 105 packages
# with no torch, nvidia-* or transformers among them.
name: Dependency pins

on:
  push:
    # Conflicts appear when dependencies change, so gate on those files rather
    # than running this on every commit.
    paths:
      - "backend/pyproject.toml"
      - "backend/requirements.txt"
      - "backend/Dockerfile"
      - "scripts/check_pins.py"
      - "scripts/check_docker_extras.py"
      - ".github/workflows/ci-deps.yml"
  pull_request:
    paths:
      - "backend/pyproject.toml"
      - "backend/requirements.txt"
      - "backend/Dockerfile"
      - "scripts/check_pins.py"
      - "scripts/check_docker_extras.py"
      - ".github/workflows/ci-deps.yml"
  # Upstream can introduce a conflict without this repository changing at all,
  # so also check on a schedule.
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Report every offending extra in one run, not one per fix cycle.
      fail-fast: false
      matrix:
        include:
          # `patents` is patent-client, which requires httpx<0.28 and
          # pypdf<5.0: literature.py uses it for online USPTO/EPO patent
          # search, so the dependency is real, and so is what it costs. It used
          # to be part of `intel`, which the Dockerfile installs - the image
          # shipped the downgraded pair. Now nothing installs it by default and
          # the drift is recorded here with exact versions, so this stays green
          # while it is the one that was reviewed and fails again the moment it
          # changes or a new package joins it.
          - extra: patents
            allow: "httpx:0.27.2,pypdf:4.3.1"
          # `intel` must stay clean: it is installed by the Dockerfile and
          # recommended in the user guides.
          - { extra: intel,       allow: "" }
          - { extra: science,     allow: "" }
          # P1 #24: install.sh / product path installs llm; keep it in the pin matrix.
          - { extra: llm,         allow: "" }
          - { extra: optimize,    allow: "" }
          - { extra: pydoe,       allow: "" }
          - { extra: export,      allow: "" }
          - { extra: file_ingest, allow: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches backend/Dockerfile

      - name: Resolve ${{ matrix.extra }}, and the same project without extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # The baseline is the control. `--dry-run --report` does not apply
          # requirements.txt as a constraint, so pyproject's `>=` bounds resolve
          # to whatever is newest on PyPI — identically for every extra. Without
          # subtracting that, the job reports the same four "upgrades" forever
          # and stops meaning anything.
          #
          # `--ignore-installed` on BOTH, and it is load-bearing rather than
          # tidy: without it `--dry-run` omits already-satisfied packages, so the
          # two reports get truncated by different amounts and the subtraction
          # compares against a baseline that is missing exactly the packages in
          # question. Measured locally: 1 package without the flag, 51 with it.
          pip install --dry-run --ignore-installed --report /tmp/baseline.json -e '.'
          pip install --dry-run --ignore-installed --report /tmp/report.json \
            -e '.[${{ matrix.extra }}]'

      - name: Assert the extra did not move a pinned dependency
        run: |
          python scripts/check_pins.py backend/requirements.txt \
            --report=/tmp/report.json --baseline=/tmp/baseline.json \
            --allow='${{ matrix.allow }}'

  # The production image is `pip install -r requirements.txt` followed by `pip install -e ".[<many extras>]"`, and the
  # second step is free to *replace* what the first pinned - that is how patent-client put httpx 0.27.2 and pypdf 4.3.1
  # in it. The job above resolves one extra at a time and the image is not built in CI, so nothing saw the combination.
  # This resolves the Dockerfile's exact list with the pins as constraints: a conflict is an error, not a downgrade.
  dockerfile-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches backend/Dockerfile

      - name: Resolve the extras the Dockerfile installs against requirements.txt
        run: |
          python -m pip install --upgrade pip uv
          python scripts/check_docker_extras.py --python-version 3.11
